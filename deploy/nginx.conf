# Static SPA server for the built databus-app (app/dist).
# Mounted into nginx:alpine by compose.app.yml. See deploy/VPS_HTTPS_TESTING.md (A3).
#
# /api is NOT handled here — Traefik path-routes it to the orchestrator before it
# reaches nginx (deploy/traefik/dynamic/dynamic.yml).

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA history-mode fallback: the router uses createWebHistory, so unknown paths
    # must serve index.html and let Vue Router take over client-side.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite emits content-hashed assets under /assets — safe to cache immutably.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Never cache the entry document, so a redeploy is picked up immediately.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
