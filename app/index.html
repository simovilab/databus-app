<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Databús</title>

    <base href="/" />

    <meta name="color-scheme" content="light dark" />
    <meta
      name="viewport"
      content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />

    <link rel="shortcut icon" type="image/png" href="/favicon.png" />

    <!-- Matches manifest.theme_color: the green bar's own colour, sampled from
         the "db" mark artwork. Tints the Android task switcher and the browser
         UI. -->
    <meta name="theme-color" content="#6dc067" />

    <!-- add to homescreen for ios -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Databús" />
    <!-- iOS ignores the manifest icons and does not support `maskable`, so it
         needs its own link. It also does not support transparency here: source
         art like /logo/databus-db-dark.png has an alpha channel, which iOS
         composites onto BLACK. This one is the opaque flattened variant at the
         documented 180x180 (black "db" + green bar on white), so the
         home-screen icon is a clean tile. -->
    <link rel="apple-touch-icon" href="/pwa/apple-touch-icon-180x180.png" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  </head>

  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>

</html>
