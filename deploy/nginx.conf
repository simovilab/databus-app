# Static SPA server for the built databus-app (app/dist).
# Mounted into nginx:alpine by compose.app.yml. See deploy/VPS_HTTPS_TESTING.md (A3).
#
# /api is NOT handled here — Traefik path-routes it to the orchestrator before it
# reaches nginx (deploy/traefik/dynamic/dynamic.yml).

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA history-mode fallback: the router uses createWebHistory, so unknown paths
    # must serve index.html and let Vue Router take over client-side.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite emits content-hashed assets under /assets — safe to cache immutably.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Never cache the entry document, so a redeploy is picked up immediately.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # The service worker must never be served stale: a cached sw.js pins the app
    # to an old precache manifest, so a redeploy would never reach installed
    # clients. Browsers bypass the HTTP cache for the SW script itself on the
    # update check, but any intermediary must not hold it either.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Same for the Workbox runtime and the precache manifest it loads.
    location ~* ^/(workbox-.*\.js|registerSW\.js)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # The manifest changes with branding/theme; keep it revalidating.
    location = /manifest.webmanifest {
        types { } default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }
}
