# ============================================================================
#
# Zensical config for the databus-app documentation site.
# Mirrors the structure used by the sibling ../databus repo's docs/zensical.toml
# — same theme/feature set, same "index.md + table of pages" section pattern —
# scaled down for a single Ionic Vue frontend rather than a multi-service
# backend platform.
#
# ============================================================================

[project]

site_name = "Databús App"
docs_dir = "content"
site_description = "Documentation for the Databús operator app — the Ionic Vue + Capacitor client bus drivers and fleet operators use to start/end runs and stream GPS telemetry."
site_author = "https://simovilab.org"

repo_url = "https://github.com/simovilab/databus-app"
repo_name = "simovilab/databus-app"
edit_uri = "edit/main/docs/content/"

# TODO: set once this site has a production host (see ../databus's docs for the
# equivalent TODO — likely a sibling subdomain of that same docs host).
#site_url = "https://docs.databus.cr/app/"

copyright = """
Copyright &copy; 2026 SIMOVI Lab
"""

nav = [
  { "Home" = "index.md" },

  { "Concepts" = [
      "concepts/index.md",
      { "What is the Databús app" = "concepts/what-is-databus-app.md" },
      { "The run lifecycle" = "concepts/run-lifecycle.md" },
      { "Telemetry: hot path vs warm path" = "concepts/telemetry-paths.md" },
  ] },

  { "Architecture" = [
      "architecture/index.md",
      { "System context" = "architecture/system-context.md" },
      { "Screens & navigation" = "architecture/screens-and-navigation.md" },
      { "Project layout" = "architecture/project-layout.md" },
      { "Telemetry seam (dev vs prod)" = "architecture/telemetry-seam.md" },
  ] },

  { "App behavior" = [
      "app-behavior/index.md",
      { "Trip setup & route/trip labels" = "app-behavior/trip-setup-and-labels.md" },
      { "Theming & typography" = "app-behavior/theming.md" },
      { "PWA (installable web build)" = "app-behavior/pwa.md" },
      { "Persistence" = "app-behavior/persistence.md" },
  ] },

  { "Development" = [
      "development/index.md",
      { "Getting started" = "development/getting-started.md" },
      { "Testing" = "development/testing.md" },
      { "Conventions" = "development/conventions.md" },
  ] },

  { "Deployment" = [
      "deployment/index.md",
      { "VPS HTTPS device testing" = "deployment/vps-https-testing.md" },
      { "Native builds" = "deployment/native-builds.md" },
  ] },

  { "Backend integration" = [
      "backend-integration/index.md",
      { "Databús contract & open asks" = "backend-integration/databus-integration.md" },
      { "Known issues" = "backend-integration/known-issues.md" },
  ] },
]

# ----------------------------------------------------------------------------
[project.theme]

favicon = "assets/logo/favicon.png"
logo = "assets/logo/databus-mark.png"

language = "en"

features = [
  "announce.dismiss",
  "content.action.edit",
  "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

# ----------------------------------------------------------------------------
[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/simovilab/databus-app"

[[project.extra.social]]
icon = "lucide/globe"
link = "https://simovilab.org"

# ----------------------------------------------------------------------------
# Markdown extensions — same set as ../databus/docs/zensical.toml, kept
# identical so authoring conventions (admonitions, tabs, mermaid fences, task
# lists) transfer directly between the two docs sites.
[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.arithmatex]
generic = true
[project.markdown_extensions.pymdownx.betterem]
[project.markdown_extensions.pymdownx.caret]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.emoji]
emoji_generator = "zensical.extensions.emoji.to_svg"
emoji_index = "zensical.extensions.emoji.twemoji"
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.keys]
[project.markdown_extensions.pymdownx.magiclink]
[project.markdown_extensions.pymdownx.mark]
[project.markdown_extensions.pymdownx.smartsymbols]
[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
combine_header_slug = true
[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true
[project.markdown_extensions.pymdownx.tilde]
